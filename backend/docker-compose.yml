services:
  nosql:
    image: ghcr.io/oracle/nosql:latest-ce
    container_name: emoji-generator-nosql
    hostname: kvlite
    environment:
      KV_PROXY_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - nosql-data:/kvroot
    healthcheck:
      test: ["CMD", "java", "-jar", "lib/kvstore.jar", "ping", "-host", "kvlite", "-port", "5000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  nosql-data:
